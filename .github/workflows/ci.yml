name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://cloneinsta:cloneinsta_dev_password@localhost:5432/cloneinsta?schema=public
      TEST_DATABASE_URL: postgresql://cloneinsta:cloneinsta_dev_password@localhost:5432/cloneinsta_test?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloneinsta
          POSTGRES_PASSWORD: cloneinsta_dev_password
          POSTGRES_USER: cloneinsta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloneinsta -d cloneinsta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create integration test database
        run: |
          node --input-type=module <<'NODE'
          import { Client } from "pg";

          const client = new Client({
            connectionString: process.env.DATABASE_URL
          });

          await client.connect();

          const existingDb = await client.query(
            "SELECT 1 FROM pg_database WHERE datname = 'cloneinsta_test'"
          );

          if (existingDb.rowCount === 0) {
            await client.query('CREATE DATABASE "cloneinsta_test"');
          }

          await client.end();
          NODE

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply test database migrations
        run: npm run db:migrate:test

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
